runtime: hermes
kind: execution_projection
projection_roots:
  - ddalggak
entrypoints:
  - "/ddalggak <subcommand>"
capabilities:
  skill_router: true
  references: true
  templates: true
  profile_isolation: true
  native_skill_lifecycle: true
loss_model:
  - "Hermes installs the shared root through its profile-aware Skills Hub; ddalggak setup/status/auto-update do not manage that installation."
